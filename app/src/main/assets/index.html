<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>MarketPilot AI</title><style>body{margin:0;background:#f3f6fc;color:#14243d;font:16px system-ui}header{background:#132d55;color:white;padding:24px}header h1{margin:0;font-size:27px}main{padding:18px;max-width:640px;margin:auto}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 15px #132d5512}button{background:#2258c9;color:white;border:0;border-radius:9px;padding:12px 16px;margin:5px;font-size:15px}textarea,input,select{box-sizing:border-box;width:100%;border:1px solid #cad5e7;border-radius:9px;padding:12px;margin:8px 0;font:inherit}nav{display:flex;overflow:auto;background:white;padding:10px}nav button{flex:1;white-space:nowrap}small{color:#64748b}.pill{display:inline-block;padding:5px 9px;background:#e5eefc;border-radius:20px}</style></head><body><header><h1>MarketPilot AI</h1><div>Marketing assistant · Demo</div></header><nav><button onclick="view('dashboard')">Dashboard</button><button onclick="view('create')">Create Post</button><button onclick="view('queue')">Queue</button></nav><main id="root"></main><script>
const key='marketpilot-demo-posts';let posts=JSON.parse(localStorage.getItem(key)||'[]');function save(){localStorage.setItem(key,JSON.stringify(posts))}
function view(page){let root=document.getElementById('root');if(page==='dashboard'){root.innerHTML='<div class="card"><h2>Welcome to MarketPilot</h2><p>Prepare, approve and schedule social content in one place.</p><p><span class="pill">'+posts.length+' posts</span> <span class="pill">'+posts.filter(p=>p.status==='Approved').length+' approved</span></p><button onclick="view(\'create\')">Create a post</button></div><div class="card"><h3>Demo notice</h3><p>This app stores drafts on your device. It does not connect to Instagram, Facebook or an AI API.</p></div>'}
else if(page==='create'){root.innerHTML='<div class="card"><h2>Create marketing post</h2><label>Business</label><input id="biz" value="ABM SHOE BAZAR"><label>Campaign</label><select id="campaign"><option>New Arrival</option><option>Festival Offer</option><option>Seasonal Collection</option><option>Discount</option></select><label>Product / Details</label><textarea id="details" rows="4" placeholder="e.g. stylish sneakers for men"></textarea><button onclick="makePost()">Prepare Draft</button></div>'}
else{root.innerHTML='<h2>Post Queue</h2>'+ (posts.length?posts.map((p,i)=>'<div class="card"><small>'+p.campaign+' · '+p.status+'</small><h3>'+p.biz+'</h3><p>'+escapeHtml(p.text)+'</p><button onclick="setStatus('+i+',\'Approved\')">Approve</button><button onclick="setStatus('+i+',\'Scheduled (demo)\')">Schedule (demo)</button><button onclick="removePost('+i+')">Delete</button></div>').join(''):'<div class="card">No drafts yet.</div>')}
}function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function makePost(){let biz=document.getElementById('biz').value.trim(),campaign=document.getElementById('campaign').value,details=document.getElementById('details').value.trim();if(!details){alert('Enter product details');return}let text='Discover '+details+' at '+biz+'! Visit us to explore the collection. #Footwear #NewStyle';posts.unshift({biz,campaign,text,status:'Draft'});save();view('queue')}function setStatus(i,status){posts[i].status=status;save();view('queue')}function removePost(i){posts.splice(i,1);save();view('queue')}view('dashboard');
</script></body></html>
